<style>
/* ---- phone frame ----
   This is a phone app, so on a window wider than a phone it is shown in a phone-sized panel in the middle of the
   screen. The panel is <body> itself, because the app renders directly into it; making it a scrolling, transformed
   box also keeps the app's fixed pieces (the Add a sale bar, the sheets, the toast) inside the panel instead of
   across the desktop. Below 560px none of this applies and the app fills the screen as before.
   The app's own wide layouts are switched off further up, by pushing its breakpoints out of reach. */
html { background: var(--bg); }
@media (min-width: 560px) {
  /* `overflow` on <body> is otherwise handed up to the window; giving <html> its own stops that, so the panel
     really is the scrolling box. */
  html { background: #16241f; height: 100%; overflow: hidden; }
  body {
    position: fixed;
    top: 24px;
    bottom: 24px;
    left: 50%;
    width: 402px;
    margin: 0 0 0 -201px;
    overflow: hidden auto;
    overscroll-behavior: contain;
    border-radius: 28px;
    box-shadow: 0 24px 60px rgb(0 0 0 / 0.45);
    transform: translateZ(0);
  }
  /* full-height screens measure against the panel, not the desktop window */
  body > main { min-height: 100%; }
}
@media (min-width: 560px) and (prefers-color-scheme: dark) {
  html { background: #050a09; }
}
</style>
</head>
